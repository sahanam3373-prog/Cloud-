<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chicken Combo | The Perfect Meal</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
</head>

<body>

    <!-- PART 1 : HERO SECTION -->
    <section class="hero">

        <!-- Top Decorative Heading -->
        <div class="hero-top">
            <span class="decor-line"></span>

            <p class="perfect-meal">The Perfect Meal</p>

            <span class="decor-line"></span>
        </div>

        <!-- Main Heading -->
        <h1>CHICKEN COMBO</h1>

        <div class="subtitle">
            <span>Multiple Flavours</span>
            <span class="separator">|</span>
            <span>One Amazing Combo</span>
        </div>

        <!-- Food Area -->
        <div class="food-area">

            <!-- Chicken Parepre -->
            <div class="food-item parepre">
                <div class="food-label">
                    <span>Chicken Parepre</span>
                    <small>↘</small>
                </div>

                <div class="food-image">
                    <img src="images/chicken-parepre.png"
                         alt="Chicken Parepre">
                </div>
            </div>

            <!-- Chiley Chicken -->
            <div class="food-item chiley">
                <div class="food-label">
                    <span>Chiley Chicken</span>
                    <small>↓</small>
                </div>

                <div class="food-image">
                    <img src="images/chiley-chicken.png"
                         alt="Chiley Chicken">
                </div>
            </div>

            <!-- Kabaab -->
            <div class="food-item kabaab">
                <div class="food-label">
                    <span>Kabaab</span>
                    <small>↙</small>
                </div>

                <div class="food-image">
                    <img src="images/kabaab.png"
                         alt="Chicken Kabaab">
                </div>
            </div>

            <!-- Rice -->
            <div class="food-item rice">
                <div class="food-image">
                    <img src="images/rice.png"
                         alt="Rice Item">
                </div>

                <div class="food-label rice-label">
                    <small>↗</small>
                    <span>Rice Item</span>
                </div>
            </div>

        </div>

        <!-- Right Side Message -->
        <div class="mood-text">
            <span>Good</span>
            <span>Food</span>
            <span>Great</span>
            <span>Mood</span>
            <b>♡</b>
        </div>

        <!-- Must Try -->
        <div class="must-try">
            <span>Must</span>
            <span>Try!</span>
        </div>

        <!-- Price -->
        <div class="price-box">
            <p>Starts at</p>
            <strong>₹250</strong>
        </div>

        <!-- Combo Name -->
        <div class="combo-name">
            <span>✦</span>
            Chicken Combo
            <span>✦</span>
        </div>

    </section>

</body>
</html>
